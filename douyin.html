<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>周翊然Tz 도우인 아카이브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Archivo+Black&display=swap" rel="stylesheet" />
<style>
:root {
--pink: #F0577F;
--pink-pale: #FDEEF1;
--pink-dim: #f7b3c4;
--tab-inactive: #322b31;
--studio: #2E6B63;
--studio-pale: #EAF3F1;
--black: #1a1216;
--gray-muted: #c4c4c4;
--gray-bg: #f4f4f4;
--border: #ececec;
--white: #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
font-family: 'Pretendard', -apple-system, sans-serif;
background: var(--white);
color: var(--black);
letter-spacing: -0.01em;
-webkit-font-smoothing: antialiased;
}
.zh { font-family: 'Noto Sans SC', 'Pretendard', sans-serif; font-weight: 300; letter-spacing: 0; }
/* ============ HERO / DARK BAND ============ */
.hero-band {
background: var(--black) url('IMG_6518.jpeg') center 25% / cover no-repeat;
padding: 20px 20px 0;
position: relative;
overflow: hidden;
}
.hero-band::before {
content: '';
position: absolute;
inset: 0;
background: linear-gradient(180deg, rgba(26,18,22,0.25) 0%, rgba(26,18,22,0.55) 45%, rgba(26,18,22,0.97) 100%);
pointer-events: none;
z-index: 0;
}
.hero-nav,
.archive-wordmark,
.archive-subtitle {
position: relative;
z-index: 1;
}
.hero-nav {
max-width: 860px;
margin: 0 auto;
display: flex;
align-items: center;
justify-content: flex-end;
gap: 14px;
}
.hamburger-btn,
.calendar-btn {
display: flex;
width: 36px;
height: 36px;
background: transparent;
border: none;
cursor: pointer;
align-items: center;
justify-content: center;
flex-shrink: 0;
filter: drop-shadow(0 1px 3px rgba(0,0,0,0.55));
}
.hamburger-btn {
flex-direction: column;
gap: 6px;
}
.hamburger-btn .bar {
width: 16px;
height: 1.5px;
background: var(--white);
transition: transform 0.2s ease, opacity 0.2s ease;
}
.hamburger-btn.open .bar:nth-child(1) { transform: translateY(3.75px) rotate(45deg); }
.hamburger-btn.open .bar:nth-child(2) { transform: translateY(-3.75px) rotate(-45deg); }
.calendar-btn svg { width: 18px; height: 18px; }
.archive-subtitle {
max-width: 860px;
margin: 0 auto;
font-size: 13px;
font-weight: 500;
color: rgba(255,255,255,0.6);
letter-spacing: -0.005em;
padding: 0 0 20px;
}
/* side drawer nav: 클릭하면 오른쪽에서 슬라이드로 튀어나오는 인덱스형 메뉴 */
.side-drawer-overlay {
position: fixed;
inset: 0;
background: rgba(26,18,22,0.6);
opacity: 0;
pointer-events: none;
transition: opacity 0.25s ease;
z-index: 600;
}
.side-drawer-overlay.open { opacity: 1; pointer-events: auto; }
.side-drawer {
position: fixed;
top: 0;
right: 0;
height: 100%;
width: min(300px, 78vw);
background: var(--black);
transform: translateX(100%);
transition: transform 0.3s ease;
z-index: 601;
display: flex;
flex-direction: column;
padding: 20px 0 0;
}
.side-drawer.open { transform: translateX(0); }
.side-drawer-close {
align-self: flex-end;
width: 32px;
height: 32px;
margin: 0 20px 24px;
background: rgba(255,255,255,0.08);
border: none;
border-radius: 3px;
color: var(--white);
font-size: 15px;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
}
.side-drawer-close:hover { background: rgba(255,255,255,0.16); }
.side-drawer-index { display: flex; flex-direction: column; }
.side-drawer-item {
display: flex;
align-items: baseline;
gap: 14px;
padding: 20px 24px;
border-top: 1px solid rgba(255,255,255,0.08);
text-decoration: none;
color: rgba(255,255,255,0.55);
font-size: 16px;
font-weight: 600;
letter-spacing: -0.01em;
transition: color 0.15s;
}
.side-drawer-item:first-child { border-top: none; }
.side-drawer-item .idx {
font-family: 'Archivo Black', 'Pretendard', sans-serif;
font-size: 11px;
color: var(--pink-dim);
letter-spacing: 0.03em;
}
.side-drawer-item:hover { color: rgba(255,255,255,0.85); }
.side-drawer-item.current { color: var(--pink); }
.side-drawer-item.current .idx { color: var(--pink); }
.side-drawer-item.toggle {
width: 100%;
background: none;
border: none;
border-top: 1px solid rgba(255,255,255,0.08);
font-family: inherit;
cursor: pointer;
}
.side-drawer-item.toggle:first-child { border-top: none; }
.side-drawer-caret {
margin-left: auto;
font-size: 11px;
transition: transform 0.2s ease;
}
.side-drawer-item.toggle.open .side-drawer-caret { transform: rotate(180deg); }
.side-drawer-submenu {
max-height: 0;
overflow: hidden;
transition: max-height 0.25s ease;
background: rgba(255,255,255,0.03);
display: flex;
flex-direction: column;
}
.side-drawer-submenu.open { max-height: 120px; }
.side-drawer-subitem {
display: block;
padding: 14px 24px 14px 48px;
text-decoration: none;
color: rgba(255,255,255,0.45);
font-size: 14px;
font-weight: 500;
letter-spacing: -0.01em;
transition: color 0.15s;
}
.side-drawer-subitem:hover { color: rgba(255,255,255,0.75); }
.side-drawer-subitem.current { color: var(--pink); }
.archive-wordmark {
max-width: 860px;
margin: 0 auto;
font-family: 'Archivo Black', 'Pretendard', sans-serif;
font-weight: 400;
font-size: 52px;
line-height: 0.92;
color: var(--white);
letter-spacing: -0.02em;
padding: 16px 0 18px;
}
/* ============ WHITE PANEL ============ */
.panel {
max-width: 860px;
margin: 0 auto;
padding: 0 20px;
}
.feed-header {
display: flex;
align-items: baseline;
justify-content: space-between;
padding: 18px 0 4px;
}
.feed-title { font-size: 13px; font-weight: 700; color: var(--black); letter-spacing: -0.01em; }
.post-count-badge { font-size: 11px; color: var(--gray-muted); font-weight: 500; }
/* douyin card: 계정 폭파 등 사건 아카이빙용 타임라인 카드 */
#douyin-feed { padding-bottom: 2rem; padding-top: 8px; }
.douyin-card { padding: 18px 0; border-top: 1px solid var(--border); }
.douyin-card:first-of-type { border-top: none; }
.douyin-date { font-size: 10px; color: var(--gray-muted); letter-spacing: 0.02em; margin-bottom: 6px; }
.douyin-title { font-size: 14px; font-weight: 700; color: var(--black); letter-spacing: -0.01em; margin-bottom: 8px; }
.douyin-body { font-size: 13px; color: var(--black); line-height: 1.7; letter-spacing: -0.005em; white-space: pre-line; }
/* image grid: weibo-style up to 3x3 (도우인 캡처/썸네일용) */
.post-image-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 2px;
margin-top: 12px;
}
.post-image-grid.cols-1 { grid-template-columns: 1fr; }
.post-image-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.grid-cell { position: relative; aspect-ratio: 1; overflow: hidden; background: var(--gray-bg); }
.grid-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
.post-image-single { margin-top: 12px; }
.post-image-single img { width: 100%; max-height: 420px; object-fit: cover; display: block; }
.grid-overlay {
position: absolute;
inset: 0;
background: rgba(26,18,22,0.55);
display: flex;
align-items: center;
justify-content: center;
color: var(--white);
font-size: 18px;
font-weight: 700;
}
.empty-state { text-align: center; padding: 4rem 1rem; color: var(--gray-muted); font-size: 13px; }
.site-footer {
text-align: center;
padding: 2rem;
font-size: 11px;
color: var(--gray-muted);
border-top: 1px solid var(--border);
margin-top: 1rem;
letter-spacing: 0.02em;
}
@media (max-width: 480px) {
.hero-band { padding: 18px 16px 0; }
.archive-wordmark { font-size: 40px; padding: 12px 0 14px; }
.panel { padding: 0 16px; }
}
/* scroll to top/bottom */
.scroll-nav {
position: fixed;
right: 18px;
bottom: 22px;
display: flex;
flex-direction: column;
gap: 8px;
z-index: 200;
}
.scroll-btn {
width: 38px;
height: 38px;
background: var(--black);
color: var(--white);
border: none;
border-radius: 3px;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
font-size: 15px;
line-height: 1;
opacity: 0;
transform: translateY(6px);
pointer-events: none;
transition: opacity 0.18s ease, transform 0.18s ease, background 0.15s;
}
.scroll-btn:hover { background: var(--pink); }
.scroll-btn.show { opacity: 0.92; transform: translateY(0); pointer-events: auto; }
@media (max-width: 480px) {
.scroll-nav { right: 14px; bottom: 16px; }
.scroll-btn { width: 34px; height: 34px; font-size: 13px; }
}
/* image lightbox */
.grid-cell img, .post-image-single img { cursor: pointer; }
.lightbox-overlay {
position: fixed;
inset: 0;
background: rgba(26,18,22,0.92);
display: none;
align-items: center;
justify-content: center;
z-index: 500;
padding: 60px 20px 30px;
}
.lightbox-overlay.open { display: flex; }
.lightbox-close {
position: fixed;
top: 18px;
right: 18px;
width: 34px;
height: 34px;
background: rgba(255,255,255,0.12);
color: var(--white);
border: none;
border-radius: 3px;
font-size: 16px;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
z-index: 501;
}
.lightbox-close:hover { background: rgba(255,255,255,0.24); }
.lightbox-body {
display: flex;
flex-direction: column;
align-items: center;
gap: 14px;
max-width: 100%;
max-height: 100%;
}
.lightbox-img {
max-width: 100%;
max-height: 76vh;
object-fit: contain;
display: block;
}
.lightbox-save {
font-size: 12px;
font-weight: 700;
padding: 9px 22px;
border: none;
border-radius: 3px;
background: var(--pink);
color: var(--white);
cursor: pointer;
font-family: inherit;
letter-spacing: -0.01em;
text-decoration: none;
display: inline-block;
transition: background 0.15s;
}
.lightbox-save:hover { background: #d9456d; }
/* ============ SCHEDULE CALENDAR MODAL ============ */
.schedule-overlay {
position: fixed;
inset: 0;
background: rgba(26,18,22,0.75);
display: none;
align-items: center;
justify-content: center;
z-index: 520;
padding: 20px;
}
.schedule-overlay.open { display: flex; }
.schedule-modal {
background: var(--white);
border-radius: 4px;
width: 100%;
max-width: 360px;
padding: 20px;
max-height: 86vh;
overflow-y: auto;
position: relative;
}
.schedule-modal-header {
display: flex;
align-items: center;
justify-content: center;
gap: 18px;
margin-bottom: 14px;
}
.schedule-nav-arrow {
background: none;
border: none;
font-size: 16px;
color: var(--gray-muted);
cursor: pointer;
padding: 4px 8px;
font-family: inherit;
}
.schedule-nav-arrow:hover { color: var(--black); }
#scheduleMonthLabel { font-size: 14px; font-weight: 700; color: var(--black); min-width: 90px; text-align: center; }
.schedule-today-banner {
background: var(--pink-pale);
border-radius: 3px;
padding: 10px 12px;
margin-bottom: 14px;
}
.today-label {
font-size: 11px;
font-weight: 700;
color: var(--pink);
letter-spacing: 0.02em;
display: block;
margin-bottom: 6px;
}
.today-events-row { display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px; margin-bottom: 4px; }
.today-events-row:last-child { margin-bottom: 0; }
.today-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
.today-time { color: var(--pink); font-weight: 600; flex-shrink: 0; }
.schedule-close {
position: absolute;
right: 16px;
top: 16px;
background: none;
border: none;
font-size: 15px;
color: var(--gray-muted);
cursor: pointer;
}
.schedule-close:hover { color: var(--black); }
.schedule-weekdays {
display: grid;
grid-template-columns: repeat(7, 1fr);
text-align: center;
font-size: 11px;
color: var(--gray-muted);
margin-bottom: 6px;
}
.schedule-grid {
display: grid;
grid-template-columns: repeat(7, 1fr);
row-gap: 10px;
text-align: center;
}
.sched-day {
font-size: 13px;
color: var(--black);
cursor: pointer;
padding: 4px 0;
}
.sched-day:empty { cursor: default; }
.sched-day.today { font-weight: 700; color: var(--pink); }
.sched-day.selected span.sched-num { background: var(--gray-bg); border-radius: 50%; padding: 3px 6px; }
.sched-num { display: inline-block; }
.sched-dots { display: flex; justify-content: center; gap: 2px; margin-top: 3px; height: 4px; }
.sched-dot { width: 4px; height: 4px; border-radius: 50%; display: inline-block; }
.schedule-detail {
border-top: 1px solid var(--border);
margin-top: 14px;
padding-top: 12px;
min-height: 40px;
}
.sched-event-row { display: flex; gap: 8px; font-size: 12.5px; margin-bottom: 8px; align-items: flex-start; }
.sched-event-row:last-child { margin-bottom: 0; }
.sched-event-row .sched-dot { flex-shrink: 0; margin-top: 5px; }
.sched-event-row .sched-time { color: var(--pink); font-weight: 600; flex-shrink: 0; }
.sched-empty { font-size: 12px; color: var(--gray-muted); text-align: center; padding: 8px 0; }
.schedule-legend {
display: flex;
gap: 14px;
margin-top: 14px;
padding-top: 12px;
border-top: 1px solid var(--border);
font-size: 11px;
color: var(--gray-muted);
}
.schedule-legend .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 4px; }
</style>
</head>

<script>
function toggleMobileMenu() {
document.getElementById('hamburgerBtn').classList.toggle('open');
document.getElementById('sideDrawer').classList.toggle('open');
document.getElementById('sideDrawerOverlay').classList.toggle('open');
document.body.style.overflow = document.getElementById('sideDrawer').classList.contains('open') ? 'hidden' : '';
}
function toggleArchiveSubmenu() {
document.getElementById('archiveMenuToggle').classList.toggle('open');
document.getElementById('archiveSubmenu').classList.toggle('open');
}
function formatDateTime(d) {
const date = new Date(d);
const month = date.getMonth() + 1;
const day = date.getDate();
const hour = d.includes('T') ? date.getHours().toString().padStart(2,'0') : null;
const min = d.includes('T') ? date.getMinutes().toString().padStart(2,'0') : null;
return hour ? `${month}.${day} ${hour}:${min}` : `${month}.${day}`;
}
function renderImages(images) {
if (!images || !images.length) return '';
if (images.length === 1) {
return `<div class="post-image-single"><img src="${images[0]}" alt="게시물 이미지" loading="lazy" onclick="openLightbox('${images[0]}')" /></div>`;
}
const shown = images.slice(0, 9);
const remaining = images.length - 9;
const colsClass = shown.length === 2 ? 'cols-2' : '';
const cells = shown.map((src, i) => {
if (i === 8 && remaining > 0) {
return `<div class="grid-cell"><img src="${src}" alt="게시물 이미지" loading="lazy" onclick="openLightbox('${src}')" /><div class="grid-overlay">+${remaining}</div></div>`;
}
return `<div class="grid-cell"><img src="${src}" alt="게시물 이미지" loading="lazy" onclick="openLightbox('${src}')" /></div>`;
}).join('');
return `<div class="post-image-grid ${colsClass}">${cells}</div>`;
}
function renderDouyinFeed() {
const events = (typeof douyinEvents !== 'undefined' ? douyinEvents : []).slice()
.sort((a, b) => new Date(b.date) - new Date(a.date));
document.getElementById('feed-count').textContent = events.length + '개';
if (!events.length) {
document.getElementById('douyin-feed').innerHTML = '<div class="empty-state">기록이 없습니다.</div>';
return;
}
document.getElementById('douyin-feed').innerHTML = events.map(ev => `
<div class="douyin-card">
<div class="douyin-date">${formatDateTime(ev.date)}</div>
<div class="douyin-title">${ev.title}</div>
${ev.body ? `<div class="douyin-body">${ev.body}</div>` : ''}
${ev.images && ev.images.length ? renderImages(ev.images) : ''}
</div>
`).join('');
}
renderDouyinFeed();
// ============ 스케줄 캘린더 모달 ============
const SCHEDULE_COLORS = { live: '#FFC53D', event: 'var(--pink)', shoot: '#8B5FBF' };
let scheduleViewDate = new Date();
let scheduleMonthEvents = {};
function openSchedule() {
document.getElementById('scheduleOverlay').classList.add('open');
document.body.style.overflow = 'hidden';
renderTodayBanner();
renderScheduleCalendar();
}
function renderTodayBanner() {
const events = typeof scheduleEvents !== 'undefined' ? scheduleEvents : [];
const now = new Date();
const todayStr = now.toDateString();
const todays = events.filter(e => new Date(e.date).toDateString() === todayStr);
const banner = document.getElementById('scheduleTodayBanner');
if (!todays.length) {
banner.style.display = 'none';
return;
}
document.getElementById('todayDateLabel').textContent = `${now.getMonth() + 1}월 ${now.getDate()}일`;
document.getElementById('todayEventsList').innerHTML = todays.map(e => `
<div class="today-events-row">
<span class="today-dot" style="background:${SCHEDULE_COLORS[e.category] || 'var(--pink)'}"></span>
${e.time ? `<span class="today-time">${e.time}</span>` : ''}
<span>${e.title}</span>
</div>`).join('');
banner.style.display = 'block';
}
function closeSchedule() {
document.getElementById('scheduleOverlay').classList.remove('open');
document.body.style.overflow = '';
}
function changeScheduleMonth(delta) {
scheduleViewDate.setMonth(scheduleViewDate.getMonth() + delta);
renderScheduleCalendar();
}
function renderScheduleCalendar() {
const events = typeof scheduleEvents !== 'undefined' ? scheduleEvents : [];
const year = scheduleViewDate.getFullYear();
const month = scheduleViewDate.getMonth();
document.getElementById('scheduleMonthLabel').textContent = `${year}년 ${month + 1}월`;
const firstDay = new Date(year, month, 1).getDay();
const daysInMonth = new Date(year, month + 1, 0).getDate();
scheduleMonthEvents = {};
events.forEach(e => {
const d = new Date(e.date);
if (d.getFullYear() === year && d.getMonth() === month) {
const day = d.getDate();
if (!scheduleMonthEvents[day]) scheduleMonthEvents[day] = [];
scheduleMonthEvents[day].push(e);
}
});
const todayStr = new Date().toDateString();
let html = '';
for (let i = 0; i < firstDay; i++) html += '<span></span>';
for (let d = 1; d <= daysInMonth; d++) {
const isToday = new Date(year, month, d).toDateString() === todayStr;
const dayEvents = scheduleMonthEvents[d] || [];
const dots = dayEvents.map(e => `<span class="sched-dot" style="background:${SCHEDULE_COLORS[e.category] || 'var(--pink)'}"></span>`).join('');
html += `<span class="sched-day${isToday ? ' today' : ''}" data-day="${d}" onclick="selectScheduleDay(${d})"><span class="sched-num">${d}</span><span class="sched-dots">${dots}</span></span>`;
}
document.getElementById('scheduleGrid').innerHTML = html;
const isCurrentMonth = year === new Date().getFullYear() && month === new Date().getMonth();
const initialDay = (isCurrentMonth && scheduleMonthEvents[new Date().getDate()]) ? new Date().getDate() : Number(Object.keys(scheduleMonthEvents)[0]) || null;
if (initialDay) {
selectScheduleDay(initialDay);
} else {
document.getElementById('scheduleDetail').innerHTML = '<p class="sched-empty">이번 달 일정이 없습니다.</p>';
}
}
function selectScheduleDay(day) {
document.querySelectorAll('.sched-day').forEach(el => el.classList.remove('selected'));
const target = document.querySelector(`.sched-day[data-day="${day}"]`);
if (target) target.classList.add('selected');
const dayEvents = scheduleMonthEvents[day] || [];
const detail = document.getElementById('scheduleDetail');
if (!dayEvents.length) {
detail.innerHTML = '<p class="sched-empty">이 날은 일정이 없습니다.</p>';
return;
}
detail.innerHTML = dayEvents.map(e => `
<div class="sched-event-row">
<span class="sched-dot" style="background:${SCHEDULE_COLORS[e.category] || 'var(--pink)'}"></span>
${e.time ? `<span class="sched-time">${e.time}</span>` : ''}
<span>${e.title}</span>
</div>`).join('');
}
// 맨 위로 / 맨 아래로 버튼
function scrollToTop() {
window.scrollTo({ top: 0, behavior: 'smooth' });
}
function scrollToBottom() {
window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
}
function updateScrollNav() {
const scrollY = window.scrollY || document.documentElement.scrollTop;
const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
const topBtn = document.getElementById('scrollTopBtn');
const bottomBtn = document.getElementById('scrollBottomBtn');
if (!topBtn || !bottomBtn) return;
topBtn.classList.toggle('show', scrollY > 400);
bottomBtn.classList.toggle('show', maxScroll > 400 && scrollY < maxScroll - 200);
}
window.addEventListener('scroll', updateScrollNav);
window.addEventListener('resize', updateScrollNav);
updateScrollNav();
// 이미지 크게보기 + 저장
let currentLightboxSrc = '';
function openLightbox(src) {
const overlay = document.getElementById('lightboxOverlay');
const img = document.getElementById('lightboxImg');
img.src = src;
currentLightboxSrc = src;
overlay.classList.add('open');
document.body.style.overflow = 'hidden';
}
function closeLightbox() {
document.getElementById('lightboxOverlay').classList.remove('open');
document.body.style.overflow = '';
}
document.addEventListener('keydown', e => {
if (e.key === 'Escape') {
closeLightbox();
if (document.getElementById('sideDrawer').classList.contains('open')) toggleMobileMenu();
}
});
async function saveOrShareImage() {
const src = currentLightboxSrc;
if (!src) return;
const fileName = src.split('/').pop();
try {
const response = await fetch(src);
const blob = await response.blob();
const file = new File([blob], fileName, { type: blob.type || 'image/jpeg' });
if (navigator.canShare && navigator.canShare({ files: [file] })) {
await navigator.share({ files: [file] });
return;
}
} catch (err) {
// 공유가 취소되었거나 실패하면 아래 다운로드 방식으로 넘어감
}
const a = document.createElement('a');
a.href = src;
a.download = fileName;
document.body.appendChild(a);
a.click();
a.remove();
}
</script>
