<style>
:root {
--pink: #F0577F;
--pink-pale: #FDEEF1;
--pink-dim: #f7b3c4;
--tab-inactive: #322b31;
--black: #1a1216;
--gray-muted: #c4c4c4;
--gray-bg: #f4f4f4;
--border: #ececec;
--white: #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
font-family: 'Pretendard', -apple-system, sans-serif;
background: var(--white);
color: var(--black);
letter-spacing: -0.01em;
-webkit-font-smoothing: antialiased;
}

/* ============ HERO / DARK BAND ============ */
.hero-band { background: var(--black); padding: 20px 20px 24px; position: relative; }
.hero-nav { max-width: 640px; margin: 0 auto; display: flex; align-items: center; justify-content: flex-end; gap: 20px; }
.hamburger-btn,
.calendar-btn {
display: flex; width: 32px; height: 32px; background: transparent; border: none; cursor: pointer;
align-items: center; justify-content: center; flex-shrink: 0;
filter: drop-shadow(0 1px 3px rgba(0,0,0,0.55));
}
.hamburger-btn { flex-direction: column; gap: 6px; }
.hamburger-btn .bar { width: 15px; height: 1.5px; background: var(--white); transition: transform 0.2s ease, opacity 0.2s ease; }
.hamburger-btn.open .bar:nth-child(1) { transform: translateY(3.75px) rotate(45deg); }
.hamburger-btn.open .bar:nth-child(2) { transform: translateY(-3.75px) rotate(-45deg); }
.calendar-btn svg { width: 18px; height: 18px; }

.side-drawer-overlay {
position: fixed; inset: 0; background: rgba(26,18,22,0.6); opacity: 0; pointer-events: none;
transition: opacity 0.25s ease; z-index: 600;
}
.side-drawer-overlay.open { opacity: 1; pointer-events: auto; }
.side-drawer {
position: fixed; top: 0; right: 0; height: 100%; width: min(300px, 78vw); background: var(--black);
transform: translateX(100%); transition: transform 0.3s ease; z-index: 601;
display: flex; flex-direction: column; padding: 20px 0 0;
}
.side-drawer.open { transform: translateX(0); }
.side-drawer-close {
align-self: flex-end; width: 32px; height: 32px; margin: 0 20px 24px; background: none;
border: none; color: var(--white); font-size: 18px; cursor: pointer;
display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.side-drawer-close:hover { color: var(--pink); }
.side-drawer-index { display: flex; flex-direction: column; }
.side-drawer-item {
display: flex; align-items: baseline; gap: 14px; padding: 20px 24px; border-top: 1px solid rgba(255,255,255,0.08);
text-decoration: none; color: rgba(255,255,255,0.55); font-size: 16px; font-weight: 600;
letter-spacing: -0.01em; transition: color 0.15s;
}
.side-drawer-item:first-child { border-top: none; }
.side-drawer-item .idx { font-family: 'Archivo Black', 'Pretendard', sans-serif; font-size: 11px; color: var(--pink-dim); letter-spacing: 0.03em; }
.side-drawer-item:hover { color: rgba(255,255,255,0.85); }
.side-drawer-item.current { color: var(--pink); }
.side-drawer-item.current .idx { color: var(--pink); }

.page-wordmark {
max-width: 640px; margin: 0 auto; font-family: 'Archivo Black', 'Pretendard', sans-serif; font-weight: 400;
font-size: 52px; line-height: 0.92; color: var(--white); letter-spacing: -0.02em; padding: 16px 0 4px;
}
.page-sub { max-width: 640px; margin: 0 auto; font-size: 12px; color: var(--pink-dim); letter-spacing: -0.01em; }

/* ============ PANEL ============ */
.panel { max-width: 640px; margin: 0 auto; padding: 0 20px; }

/* infobox card */
.infobox {
margin-top: -1px;
background: var(--white);
border: 1px solid var(--border);
border-top: none;
padding: 22px 20px;
}
.infobox-photo {
width: 96px; height: 96px; border-radius: 50%; overflow: hidden; background: var(--pink-pale);
margin: 0 auto 14px; display: flex; align-items: center; justify-content: center;
}
.infobox-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.infobox-name { text-align: center; font-size: 18px; font-weight: 800; color: var(--black); letter-spacing: -0.01em; }
.infobox-name-zh { text-align: center; font-size: 12px; color: var(--gray-muted); margin-top: 3px; font-family: 'Noto Sans SC', 'Pretendard', sans-serif; font-weight: 300; }

.infobox-table { margin-top: 18px; border-top: 1px solid var(--border); }
.infobox-row { display: flex; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
.infobox-label { width: 84px; flex-shrink: 0; color: var(--gray-muted); font-weight: 600; }
.infobox-value { flex: 1; color: var(--black); line-height: 1.55; }
.infobox-value.tbd { color: var(--gray-muted); }

/* TOC */
.toc { display: flex; flex-wrap: wrap; gap: 6px; padding: 16px 0; }
.toc-item {
font-size: 12px; font-weight: 700; color: var(--pink); background: var(--pink-pale);
padding: 6px 12px; border-radius: 3px; text-decoration: none; letter-spacing: -0.005em;
}
.toc-item:hover { background: #fbe0e7; }

/* wiki sections */
.wiki-section { padding: 22px 0; border-top: 1px solid var(--border); scroll-margin-top: 16px; }
.wiki-section:first-of-type { border-top: 1px solid var(--border); }
.wiki-section-title {
font-size: 15px; font-weight: 800; color: var(--black); letter-spacing: -0.01em;
display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px;
}
.wiki-section-title .num { font-family: 'Archivo Black', 'Pretendard', sans-serif; font-size: 11px; color: var(--pink); }
.wiki-section-body { font-size: 13px; color: var(--black); line-height: 1.75; letter-spacing: -0.005em; }
.wiki-section-body.tbd { color: var(--gray-muted); font-style: normal; }
.wiki-subsection { margin-top: 14px; }
.wiki-subsection-title { font-size: 13px; font-weight: 700; color: var(--pink); margin-bottom: 6px; }

.site-footer { max-width: 640px; margin: 0 auto; padding: 20px 20px 40px; font-size: 11px; color: var(--gray-muted); text-align: center; }

/* ============ SCHEDULE CALENDAR MODAL ============ */
.schedule-overlay {
position: fixed;
inset: 0;
background: rgba(26,18,22,0.75);
display: none;
align-items: center;
justify-content: center;
z-index: 520;
padding: 20px;
}
.schedule-overlay.open { display: flex; }
.schedule-modal {
background: var(--white);
border-radius: 4px;
width: 100%;
max-width: 360px;
padding: 20px;
max-height: 86vh;
overflow-y: auto;
position: relative;
}
.schedule-modal-header {
display: flex;
align-items: center;
justify-content: center;
gap: 18px;
margin-bottom: 14px;
}
.schedule-nav-arrow {
background: none;
border: none;
font-size: 16px;
color: var(--gray-muted);
cursor: pointer;
padding: 4px 8px;
font-family: inherit;
}
.schedule-nav-arrow:hover { color: var(--black); }
#scheduleMonthLabel { font-size: 14px; font-weight: 700; color: var(--black); min-width: 90px; text-align: center; }
.schedule-today-banner {
background: var(--pink-pale);
border-radius: 3px;
padding: 10px 12px;
margin-bottom: 14px;
}
.today-label {
font-size: 11px;
font-weight: 700;
color: var(--pink);
letter-spacing: 0.02em;
display: block;
margin-bottom: 6px;
}
.today-events-row { display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px; margin-bottom: 4px; }
.today-events-row:last-child { margin-bottom: 0; }
.today-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
.today-time { color: var(--pink); font-weight: 600; flex-shrink: 0; }
.schedule-close {
position: absolute;
right: 16px;
top: 16px;
background: none;
border: none;
font-size: 15px;
color: var(--gray-muted);
cursor: pointer;
}
.schedule-close:hover { color: var(--black); }
.schedule-weekdays {
display: grid;
grid-template-columns: repeat(7, 1fr);
text-align: center;
font-size: 11px;
color: var(--gray-muted);
margin-bottom: 6px;
}
.schedule-grid {
display: grid;
grid-template-columns: repeat(7, 1fr);
row-gap: 10px;
text-align: center;
}
.sched-day {
font-size: 13px;
color: var(--black);
cursor: pointer;
padding: 4px 0;
}
.sched-day:empty { cursor: default; }
.sched-day.today { font-weight: 700; color: var(--pink); }
.sched-day.selected .sched-num { color: var(--pink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.sched-num { display: inline-block; }
.sched-dots { display: flex; justify-content: center; gap: 2px; margin-top: 3px; height: 4px; }
.sched-dot { width: 4px; height: 4px; border-radius: 50%; display: inline-block; }
.schedule-detail {
border-top: 1px solid var(--border);
margin-top: 14px;
padding-top: 12px;
min-height: 40px;
}
.sched-event-row { display: flex; gap: 8px; font-size: 12.5px; margin-bottom: 8px; align-items: flex-start; }
.sched-event-row:last-child { margin-bottom: 0; }
.sched-event-row .sched-dot { flex-shrink: 0; margin-top: 5px; }
.sched-event-row .sched-time { color: var(--pink); font-weight: 600; flex-shrink: 0; }
.sched-empty { font-size: 12px; color: var(--gray-muted); text-align: center; padding: 8px 0; }
.schedule-legend {
display: flex;
gap: 14px;
margin-top: 14px;
padding-top: 12px;
border-top: 1px solid var(--border);
font-size: 11px;
color: var(--gray-muted);
}
.schedule-legend .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 4px; }
</style>

<script>
function toggleMobileMenu() {
document.getElementById('hamburgerBtn').classList.toggle('open');
document.getElementById('sideDrawer').classList.toggle('open');
document.getElementById('sideDrawerOverlay').classList.toggle('open');
document.body.style.overflow = document.getElementById('sideDrawer').classList.contains('open') ? 'hidden' : '';
}
document.addEventListener('keydown', e => {
if (e.key === 'Escape' && document.getElementById('sideDrawer').classList.contains('open')) toggleMobileMenu();
});
// ============ 스케줄 캘린더 모달 ============
const SCHEDULE_COLORS = { live: '#FFC53D', event: 'var(--pink)', shoot: '#8B5FBF' };
let scheduleViewDate = new Date();
let scheduleMonthEvents = {};
function openSchedule() {
document.getElementById('scheduleOverlay').classList.add('open');
document.body.style.overflow = 'hidden';
renderTodayBanner();
renderScheduleCalendar();
}
function renderTodayBanner() {
const events = typeof scheduleEvents !== 'undefined' ? scheduleEvents : [];
const now = new Date();
const todayStr = now.toDateString();
const todays = events.filter(e => new Date(e.date).toDateString() === todayStr);
const banner = document.getElementById('scheduleTodayBanner');
if (!todays.length) {
banner.style.display = 'none';
return;
}
document.getElementById('todayDateLabel').textContent = `${now.getMonth() + 1}월 ${now.getDate()}일`;
document.getElementById('todayEventsList').innerHTML = todays.map(e => `
<div class="today-events-row">
<span class="today-dot" style="background:${SCHEDULE_COLORS[e.category] || 'var(--pink)'}"></span>
${e.time ? `<span class="today-time">${e.time}</span>` : ''}
<span>${e.title}</span>
</div>`).join('');
banner.style.display = 'block';
}
function closeSchedule() {
document.getElementById('scheduleOverlay').classList.remove('open');
document.body.style.overflow = '';
}
function changeScheduleMonth(delta) {
scheduleViewDate.setMonth(scheduleViewDate.getMonth() + delta);
renderScheduleCalendar();
}
function renderScheduleCalendar() {
const events = typeof scheduleEvents !== 'undefined' ? scheduleEvents : [];
const year = scheduleViewDate.getFullYear();
const month = scheduleViewDate.getMonth();
document.getElementById('scheduleMonthLabel').textContent = `${year}년 ${month + 1}월`;
const firstDay = new Date(year, month, 1).getDay();
const daysInMonth = new Date(year, month + 1, 0).getDate();
scheduleMonthEvents = {};
events.forEach(e => {
const d = new Date(e.date);
if (d.getFullYear() === year && d.getMonth() === month) {
const day = d.getDate();
if (!scheduleMonthEvents[day]) scheduleMonthEvents[day] = [];
scheduleMonthEvents[day].push(e);
}
});
const todayStr = new Date().toDateString();
let html = '';
for (let i = 0; i < firstDay; i++) html += '<span></span>';
for (let d = 1; d <= daysInMonth; d++) {
const isToday = new Date(year, month, d).toDateString() === todayStr;
const dayEvents = scheduleMonthEvents[d] || [];
const dots = dayEvents.map(e => `<span class="sched-dot" style="background:${SCHEDULE_COLORS[e.category] || 'var(--pink)'}"></span>`).join('');
html += `<span class="sched-day${isToday ? ' today' : ''}" data-day="${d}" onclick="selectScheduleDay(${d})"><span class="sched-num">${d}</span><span class="sched-dots">${dots}</span></span>`;
}
document.getElementById('scheduleGrid').innerHTML = html;
const isCurrentMonth = year === new Date().getFullYear() && month === new Date().getMonth();
const initialDay = (isCurrentMonth && scheduleMonthEvents[new Date().getDate()]) ? new Date().getDate() : Number(Object.keys(scheduleMonthEvents)[0]) || null;
if (initialDay) {
selectScheduleDay(initialDay);
} else {
document.getElementById('scheduleDetail').innerHTML = '<p class="sched-empty">이번 달 일정이 없습니다.</p>';
}
}
function selectScheduleDay(day) {
document.querySelectorAll('.sched-day').forEach(el => el.classList.remove('selected'));
const target = document.querySelector(`.sched-day[data-day="${day}"]`);
if (target) target.classList.add('selected');
const dayEvents = scheduleMonthEvents[day] || [];
const detail = document.getElementById('scheduleDetail');
if (!dayEvents.length) {
detail.innerHTML = '<p class="sched-empty">이 날은 일정이 없습니다.</p>';
return;
}
detail.innerHTML = dayEvents.map(e => `
<div class="sched-event-row">
<span class="sched-dot" style="background:${SCHEDULE_COLORS[e.category] || 'var(--pink)'}"></span>
${e.time ? `<span class="sched-time">${e.time}</span>` : ''}
<span>${e.title}</span>
</div>`).join('');
}
</script>
