<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" type="image/png" href="favicon-32.png" />

<title>ARCHIVE · 001122Tz</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Archivo+Black&display=swap" rel="stylesheet" />
<style>
:root {
--pink: #F0577F;
--pink-pale: #FDEEF1;
--pink-dim: #f7b3c4;
--tab-inactive: #322b31;
--studio: #2E6B63;
--studio-pale: #EAF3F1;
--black: #1a1216;
--gray-muted: #c4c4c4;
--gray-bg: #f4f4f4;
--border: #ececec;
--white: #ffffff;
}
:root.dark {
--white: #17111a;
--black: #f0ece8;
--gray-bg: #241b22;
--border: #382c34;
--gray-muted: #9a8f95;
--pink-pale: #3a2430;
}
:root.dark .infobox-photo { background: #241b22; }
:root.dark .mag-cover { background: #241b22; }
* { box-sizing: border-box; margin: 0; padding: 0; }
button, a { -webkit-tap-highlight-color: transparent; outline: none; }
body {
font-family: 'Pretendard', -apple-system, sans-serif;
background: var(--white);
color: var(--black);
letter-spacing: -0.01em;
-webkit-font-smoothing: antialiased;
}
.zh { font-family: 'Noto Sans SC', 'Pretendard', sans-serif; font-weight: 300; letter-spacing: 0; }
.weibo-emoticon {
display: inline-block;
height: 1.15em;
width: 1.15em;
vertical-align: -2px;
object-fit: contain;
}
/* ============ HERO / DARK BAND ============ */
.hero-band {
background: var(--white);
padding: 22px 20px 0;
position: relative;
}
.hero-brand { display: flex; align-items: center; gap: 10px; position: relative; z-index: 1; }
.hero-brand-mark { width: 24px; height: 24px; background: var(--pink); color: var(--white); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; flex-shrink: 0; }
.hero-brand-title { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; color: var(--black); line-height: 1.2; }
.hero-brand-sub { font-size: 11px; color: var(--gray-muted); line-height: 1.3; margin-top: 1px; }
.hero-icons { display: flex; align-items: center; gap: 18px; position: relative; z-index: 1; }
.hero-stripe { max-width: 860px; margin: 16px auto 20px; height: 4px; background: var(--pink); position: relative; z-index: 1; }
.hero-nav,
.archive-wordmark,
.archive-subtitle,
.year-tabs {
position: relative;
z-index: 1;
}
.hero-nav {
max-width: 860px;
margin: 0 auto;
display: flex;
align-items: center;
justify-content: space-between;
gap: 14px;
}
.hamburger-btn,
.calendar-btn {
display: flex;
width: 36px;
height: 36px;
background: transparent;
border: none;
cursor: pointer;
align-items: center;
justify-content: center;
flex-shrink: 0;
color: var(--black);
}
.hamburger-btn {
flex-direction: column;
gap: 6px;
}
.hamburger-btn .bar {
width: 16px;
height: 1.5px;
background: var(--black);
transition: transform 0.2s ease, opacity 0.2s ease;
}
.hamburger-btn.open .bar:nth-child(1) { transform: translateY(3.75px) rotate(45deg); }
.hamburger-btn.open .bar:nth-child(2) { transform: translateY(-3.75px) rotate(-45deg); }
.calendar-btn svg { width: 18px; height: 18px; }
.notice-btn { position: relative; display: flex; width: 32px; height: 32px; background: transparent; border: none; cursor: pointer; align-items: center; justify-content: center; flex-shrink: 0; color: var(--black); }
.notice-btn svg { width: 18px; height: 18px; }
.notice-dot { position: absolute; top: 4px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--pink); display: none; }
.notice-dot.show { display: block; }
.theme-toggle-btn { display: flex; width: 32px; height: 32px; background: transparent; border: none; cursor: pointer; align-items: center; justify-content: center; flex-shrink: 0; color: var(--black); transition: color 0.15s; }
.theme-toggle-btn:hover { color: var(--pink); }
.archive-subtitle {
max-width: 860px;
margin: 0 auto;
font-size: 13px;
font-weight: 500;
color: rgba(255,255,255,0.6);
letter-spacing: -0.005em;
padding: 0 0 14px;
}
/* side drawer nav: 클릭하면 오른쪽에서 화면 전체 높이로 슬라이드되는 메뉴 패널 */
.side-drawer-overlay {
position: fixed;
inset: 0;
background: rgba(26,18,22,0.55);
opacity: 0;
pointer-events: none;
transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1);
z-index: 600;
}
.side-drawer-overlay.open { opacity: 1; pointer-events: auto; }
.side-drawer {
position: fixed;
top: 0;
right: 0;
height: 100dvh;
width: min(340px, 88vw);
background: var(--white);
border-top-left-radius: 20px;
border-bottom-left-radius: 20px;
box-shadow: -8px 0 32px rgba(26,18,22,0.14);
transform: translateX(100%);
opacity: 0;
transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
z-index: 601;
display: flex;
flex-direction: column;
}
.side-drawer.open { transform: translateX(0); opacity: 1; }
.side-drawer-top {
display: flex;
align-items: center;
gap: 18px;
padding: 40px 32px 0;
flex-shrink: 0;
}
.side-drawer-top .calendar-btn,
.side-drawer-top .theme-toggle-btn,
.side-drawer-top .notice-btn { width: auto; height: auto; }
.side-drawer-top .calendar-btn svg,
.side-drawer-top .notice-btn svg { width: 17px; height: 17px; }
.side-drawer-top button { -webkit-tap-highlight-color: transparent; outline: none; box-shadow: none; -webkit-appearance: none; appearance: none; }
.side-drawer-top button:focus,
.side-drawer-top button:active,
.side-drawer-top button:focus-visible { outline: none; box-shadow: none; background: transparent; }
.side-drawer-close {
width: 26px;
height: 26px;
margin: 0 0 0 auto;
background: none;
border: none;
color: var(--black);
font-size: 17px;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
transition: color 0.15s;
}
.side-drawer-close:hover { color: var(--pink); }
.side-drawer-body {
flex: 1;
overflow-y: auto;
padding: 34px 32px 32px;
scrollbar-width: none;
-ms-overflow-style: none;
}
.side-drawer-body::-webkit-scrollbar { display: none; }
.side-drawer-label {
font-family: 'Archivo Black', 'Pretendard', sans-serif;
font-size: 15.5px;
letter-spacing: 0.1em;
color: var(--pink);
font-weight: 800;
margin: 0 0 16px;
}
.side-drawer-label.links { margin: 32px 0 16px; }
.side-drawer-list { display: flex; flex-direction: column; }
.side-drawer-item {
display: flex;
align-items: center;
gap: 10px;
padding: 12px 0;
text-decoration: none;
color: var(--black);
font-size: 15.5px;
font-weight: 700;
letter-spacing: -0.01em;
background: none;
border: none;
outline: none;
box-shadow: none;
-webkit-appearance: none;
appearance: none;
-webkit-tap-highlight-color: transparent;
width: 100%;
text-align: left;
cursor: pointer;
font-family: inherit;
transition: color 0.15s;
}
.side-drawer-item:focus,
.side-drawer-item:active,
.side-drawer-item:focus-visible {
outline: none;
box-shadow: none;
border: none;
}
.side-drawer-item:hover { color: var(--pink); }
.side-drawer-item.current { color: var(--pink); }
.side-drawer-caret { margin-left: auto; display: flex; align-items: center; color: var(--pink); transition: transform 0.2s ease; }
.side-drawer-item.toggle.open .side-drawer-caret { transform: rotate(180deg); }
.side-drawer-external { margin-left: auto; font-size: 11px; color: var(--pink); }
.side-drawer-submenu {
max-height: 0;
overflow: hidden;
transition: max-height 0.25s ease;
display: flex;
flex-direction: column;
padding: 0 0 0 12px;
}
.side-drawer-submenu.open { max-height: 120px; }
.side-drawer-subitem {
display: block;
padding: 12px 0;
text-decoration: none;
color: var(--gray-muted);
font-size: 14.5px;
font-weight: 500;
letter-spacing: -0.01em;
transition: color 0.15s;
}
.side-drawer-subitem:hover { color: var(--black); }
.side-drawer-subitem.current { color: var(--pink); font-weight: 700; }

.side-drawer-footer {
padding: 0 32px 28px;
font-size: 10px;
color: var(--gray-muted);
flex-shrink: 0;
letter-spacing: 0.02em;
}
.archive-wordmark {
max-width: 860px;
margin: 0 auto;
font-family: 'Archivo Black', 'Pretendard', sans-serif;
font-weight: 400;
font-size: 52px;
line-height: 0.92;
color: var(--white);
letter-spacing: -0.02em;
padding: 16px 0 18px;
}
/* year index tabs: simple flat tab */
.year-tabs {
max-width: 860px;
margin: 0 auto;
display: flex;
gap: 26px;
border-bottom: 1px solid var(--border);
}
.year-tab {
padding: 0 0 12px;
height: auto;
border-radius: 0;
font-size: 16px;
font-weight: 700;
letter-spacing: -0.01em;
cursor: pointer;
background: none;
color: var(--gray-muted);
border-bottom: 2px solid transparent;
transition: color 0.15s, border-color 0.15s;
white-space: nowrap;
}
.year-tab:hover { color: var(--black); }
.year-tab.active { background: none; color: var(--black); border-bottom-color: var(--pink); }
/* ============ WHITE PANEL ============ */
.panel {
max-width: 860px;
margin: 0 auto;
padding: 0 20px;
}
/* month selector: borderless spaced text */
.month-row {
display: flex;
align-items: center;
gap: 22px;
padding: 18px 0 14px;
overflow-x: auto;
border-bottom: 2px solid var(--black);
}
.month-row::-webkit-scrollbar { display: none; }
.month-item {
font-size: 16px;
font-weight: 500;
color: #c4c4c4;
position: relative;
white-space: nowrap;
cursor: pointer;
padding-bottom: 8px;
transition: color 0.15s;
}
.month-item:hover { color: var(--black); }
.month-item.active {
font-weight: 700;
color: var(--black);
}
.month-item.active::after {
content: '';
position: absolute;
bottom: -2px;
left: 0;
right: 0;
height: 2px;
background: var(--pink);
}
.month-item .m-count {
font-size: 10px;
color: var(--gray-muted);
font-weight: 500;
margin-left: 3px;
}
.month-item.active .m-count { color: var(--pink); }
/* search + filter */
.search-row { padding: 14px 0 0; }
.search-input {
width: 100%;
padding: 10px 0;
border: none;
border-bottom: 1px solid var(--border);
font-size: 14px;
font-family: inherit;
letter-spacing: -0.01em;
background: transparent;
outline: none;
color: var(--black);
}
.search-input:focus { border-bottom-color: var(--pink); }
.search-input::placeholder { color: var(--gray-muted); }
.filter-active-bar {
font-size: 12px;
color: var(--pink);
font-weight: 600;
padding: 10px 0;
display: none;
align-items: center;
justify-content: space-between;
}
.filter-active-bar.show { display: flex; }
.clear-filter {
cursor: pointer;
font-weight: 700;
color: var(--gray-muted);
background: none;
border: none;
font-family: inherit;
font-size: 12px;
}
.clear-filter:hover { color: var(--black); }
.feed-header {
display: flex;
align-items: baseline;
justify-content: space-between;
padding: 18px 0 4px;
}
.feed-title { font-size: 13px; font-weight: 700; color: var(--black); letter-spacing: -0.01em; }
.post-count-badge { font-size: 11px; color: var(--gray-muted); font-weight: 500; }
/* ============ POSTS ============ */
#posts-feed { padding-bottom: 2rem; margin-left: 8px; padding-left: 28px; border-left: 2px solid var(--border); }
.date-index {
font-size: 11px;
font-weight: 700;
color: var(--gray-muted);
letter-spacing: 0.02em;
padding: 20px 0 10px;
}
.day-divider {
position: relative;
display: flex;
align-items: baseline;
gap: 10px;
margin: 40px 0 0;
}
.day-divider:first-child { margin-top: 22px; }
.day-divider-dot {
position: absolute;
left: -33px;
top: 8px;
width: 9px;
height: 9px;
border-radius: 50%;
background: var(--pink);
}
.day-divider-num {
font-family: 'Archivo Black', 'Pretendard', sans-serif;
font-size: 26px;
color: var(--black);
line-height: 1;
}
.day-divider-cap {
font-size: 11px;
font-weight: 700;
letter-spacing: 0.06em;
text-transform: uppercase;
color: var(--gray-muted);
}
.post-card {
padding: 18px 0;
border-top: 1px solid var(--border);
}
.post-card:first-of-type { border-top: none; }
.day-divider + .post-card { border-top: none; }
.post-meta {
display: flex;
align-items: center;
gap: 10px;
margin-bottom: 10px;
}
.post-avatar {
width: 34px;
height: 34px;
border-radius: 50%;
overflow: hidden;
flex-shrink: 0;
background: var(--pink);
}
.post-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.post-meta-info { flex: 1; min-width: 0; }
.actor-name {
font-size: 12px;
font-weight: 600;
color: var(--black);
letter-spacing: -0.01em;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.post-date { font-size: 10px; color: var(--gray-muted); margin-top: 1px; letter-spacing: 0.01em; }
.weibo-link {
font-size: 11px;
color: var(--pink);
text-decoration: none;
font-weight: 600;
letter-spacing: -0.01em;
white-space: nowrap;
flex-shrink: 0;
}
.original-text {
font-size: 11px;
color: var(--gray-muted);
line-height: 1.6;
margin-bottom: 6px;
}
.translated-text {
font-size: 13.5px;
color: var(--black);
line-height: 1.65;
font-weight: 400;
letter-spacing: -0.01em;
}
.translation-note {
font-size: 12px;
color: var(--pink);
border-left: 2px solid var(--pink);
padding-left: 8px;
margin-top: 10px;
line-height: 1.5;
letter-spacing: -0.005em;
}
/* image grid: weibo-style up to 3x3 */
.post-image-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 2px;
margin-top: 12px;
}
.post-image-grid.cols-1 { grid-template-columns: 1fr; }
.post-image-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.grid-cell { position: relative; aspect-ratio: 1; overflow: hidden; background: var(--gray-bg); }
.grid-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
.post-image-single { margin-top: 12px; }
.post-image-single img { width: 100%; max-height: 420px; object-fit: cover; display: block; }
.grid-overlay {
position: absolute;
inset: 0;
background: rgba(26,18,22,0.55);
display: flex;
align-items: center;
justify-content: center;
color: var(--white);
font-size: 18px;
font-weight: 700;
}
.yt-embed {
margin: 12px 0 0;
overflow: hidden;
aspect-ratio: 16/9;
}
.yt-embed iframe { width: 100%; height: 100%; border: none; }
.post-footer {
display: flex;
align-items: center;
justify-content: space-between;
margin-top: 12px;
}
.toggle-comments-btn {
font-size: 12px;
color: var(--pink);
font-weight: 700;
background: none;
border: none;
cursor: pointer;
font-family: inherit;
letter-spacing: -0.01em;
padding: 0;
}
.toggle-comments-btn.empty { color: var(--gray-muted); cursor: default; }
/* comments */
.comments-section {
margin-top: 14px;
padding-top: 14px;
border-top: 1px dashed var(--border);
display: none;
}
.comments-section.open { display: block; }
.comments-title {
font-size: 11px;
font-weight: 700;
color: var(--gray-muted);
letter-spacing: 0.02em;
margin-bottom: 10px;
}
.comment-item { padding: 14px 0; border-bottom: 1px solid var(--border); }
.comment-item:last-child { border-bottom: none; padding-bottom: 0; }
.comment-item:first-child { padding-top: 0; }
.comment-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.comment-avatar {
width: 22px;
height: 22px;
border-radius: 50%;
background: var(--gray-bg);
display: flex;
align-items: center;
justify-content: center;
font-size: 11px;
font-weight: 700;
color: var(--gray-muted);
flex-shrink: 0;
overflow: hidden;
}
.comment-avatar img { width: 100%; height: 100%; object-fit: cover; }
.comment-username { font-size: 11px; font-weight: 600; color: var(--black); }
.comment-original { font-size: 10px; color: var(--gray-muted); line-height: 1.6; margin: 0 0 5px; padding-left: 34px; }
.comment-translated { font-size: 12.5px; color: var(--black); line-height: 1.6; font-weight: 400; letter-spacing: -0.005em; padding-left: 34px; }
.comment-images { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 4px; margin-top: 8px; padding-left: 34px; }
.comment-images img { max-width: 120px; max-height: 140px; width: auto; height: auto; object-fit: contain; display: block; border-radius: 3px; }
.comment-note { font-size: 11px; color: var(--pink); border-left: 2px solid var(--pink); padding-left: 8px; margin: 8px 0 0 34px; line-height: 1.5; letter-spacing: -0.005em; }
/* 답글: 핑크선 없이 들여쓰기만으로 위계 구분 */
.actor-reply {
margin-top: 12px;
padding-left: 54px;
}
.actor-reply-header { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.actor-reply-avatar { width: 18px; height: 18px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
.actor-reply-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.actor-reply-name { font-size: 10px; font-weight: 600; color: var(--pink); }
.actor-reply-original { font-size: 11px; color: var(--gray-muted); line-height: 1.6; margin: 0 0 4px; }
.actor-reply-translated { font-size: 12px; color: var(--pink); font-weight: 500; line-height: 1.65; }
.actor-reply .comment-images { padding-left: 0; margin-top: 8px; }
.empty-state { text-align: center; padding: 4rem 1rem; color: var(--gray-muted); font-size: 13px; }
.site-footer {
text-align: center;
padding: 2rem;
font-size: 11px;
color: var(--gray-muted);
border-top: 1px solid var(--border);
margin-top: 1rem;
letter-spacing: 0.02em;
}
@media (max-width: 480px) {
.hero-band { padding: 18px 16px 0; }
.panel { padding: 0 16px; }
#posts-feed { margin-left: 4px; padding-left: 22px; }
.day-divider-dot { left: -27px; }
}
/* scroll to top/bottom */
.scroll-nav {
position: fixed;
right: 18px;
bottom: 22px;
display: flex;
flex-direction: column;
gap: 8px;
z-index: 200;
}
.scroll-btn {
width: 38px;
height: 38px;
background: var(--black);
color: var(--white);
border: none;
border-radius: 3px;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
font-size: 15px;
line-height: 1;
opacity: 0;
transform: translateY(6px);
pointer-events: none;
transition: opacity 0.18s ease, transform 0.18s ease, background 0.15s;
}
.scroll-btn:hover { background: var(--pink); }
.scroll-btn.show { opacity: 0.92; transform: translateY(0); pointer-events: auto; }
@media (max-width: 480px) {
.scroll-nav { right: 14px; bottom: 16px; }
.scroll-btn { width: 34px; height: 34px; font-size: 13px; }
}
/* image lightbox */
.grid-cell img, .post-image-single img, .comment-images img { cursor: pointer; }
.lightbox-overlay {
position: fixed;
inset: 0;
background: rgba(26,18,22,0.86);
display: none;
align-items: center;
justify-content: center;
z-index: 500;
padding: 60px 20px 30px;
}
.lightbox-overlay.open { display: flex; }
.lightbox-close {
position: fixed;
top: 18px;
right: 18px;
width: 34px;
height: 34px;
background: rgba(255,255,255,0.12);
color: var(--white);
border: none;
border-radius: 3px;
font-size: 16px;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
z-index: 501;
}
.lightbox-close:hover { background: rgba(255,255,255,0.24); }
.lightbox-body {
display: flex;
flex-direction: column;
align-items: center;
gap: 14px;
max-width: 100%;
max-height: 100%;
}
.lightbox-img {
max-width: 100%;
max-height: 76vh;
object-fit: contain;
display: block;
border-radius: 4px;
box-shadow: 0 4px 24px rgba(0,0,0,0.4);
}
.lightbox-save {
font-size: 12px;
font-weight: 700;
padding: 9px 22px;
border: none;
border-radius: 3px;
background: var(--pink);
color: var(--white);
cursor: pointer;
font-family: inherit;
letter-spacing: -0.01em;
text-decoration: none;
display: inline-block;
transition: background 0.15s;
}

.voice-message {

align-items: center;
gap: 6px;
background: var(--pink-pale);
border-radius: 3px;
padding: 4px 9px;

}
.voice-message:hover { background: #fbe0e7; }
.voice-message:active { opacity: 0.7; }
.voice-message .vm-play-btn {
flex-shrink: 0;
width: 12px;
height: 12px;
display: flex;
align-items: center;
justify-content: center;
}
.voice-message .vm-play-btn svg { width: 9px; height: 9px; fill: var(--pink); }
.vm-icon-play { display: block; }
.vm-icon-pause { display: none; }
.voice-message.playing .vm-icon-play { display: none; }
.voice-message.playing .vm-icon-pause { display: block; }
.voice-message .vm-waveform { display: flex; align-items: center; gap: 2px; height: 10px; }
.voice-message .vm-bar {
width: 1.5px;
background: var(--pink);
border-radius: 1px;
opacity: 0.4;
transition: opacity 0.15s ease;
}
.voice-message.playing .vm-bar { opacity: 1; animation: vm-bounce 0.9s ease-in-out infinite; }
.voice-message .vm-bar:nth-child(1) { height: 3px; }
.voice-message .vm-bar:nth-child(2) { height: 6px; }
.voice-message .vm-bar:nth-child(3) { height: 10px; }
.voice-message .vm-bar:nth-child(4) { height: 5px; }
.voice-message .vm-bar:nth-child(5) { height: 8px; }
.voice-message .vm-bar:nth-child(6) { height: 4px; }
.voice-message.playing .vm-bar:nth-child(1) { animation-delay: 0s; }
.voice-message.playing .vm-bar:nth-child(2) { animation-delay: 0.1s; }
.voice-message.playing .vm-bar:nth-child(3) { animation-delay: 0.2s; }
.voice-message.playing .vm-bar:nth-child(4) { animation-delay: 0.3s; }
.voice-message.playing .vm-bar:nth-child(5) { animation-delay: 0.4s; }
.voice-message.playing .vm-bar:nth-child(6) { animation-delay: 0.5s; }
@keyframes vm-bounce {

}
.voice-message .vm-duration { font-size: 10.5px; color: var(--pink); font-weight: 600; flex-shrink: 0; }

function downloadVoiceAudio(event, audioSrc) {

a.download = audioSrc.split('/').pop();
document.body.appendChild(a);
a.click();

// 맨 위로 / 맨 아래로 버튼
function scrollToTop() {
window.scrollTo({ top: 0, behavior: 'smooth' });
}
function scrollToBottom() {
window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
}
function updateScrollNav() {
const scrollY = window.scrollY || document.documentElement.scrollTop;
const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
const topBtn = document.getElementById('scrollTopBtn');
const bottomBtn = document.getElementById('scrollBottomBtn');
if (!topBtn || !bottomBtn) return;
topBtn.classList.toggle('show', scrollY > 400);
bottomBtn.classList.toggle('show', maxScroll > 400 && scrollY < maxScroll - 200);
}
window.addEventListener('scroll', updateScrollNav);
window.addEventListener('resize', updateScrollNav);
updateScrollNav();
// 이미지 크게보기 + 저장
let currentLightboxSrc = '';
function openLightbox(src) {
const overlay = document.getElementById('lightboxOverlay');
const img = document.getElementById('lightboxImg');
img.src = src;
currentLightboxSrc = src;
overlay.classList.add('open');
document.body.style.overflow = 'hidden';
}
function closeLightbox() {
document.getElementById('lightboxOverlay').classList.remove('open');
document.body.style.overflow = '';
}
document.addEventListener('keydown', e => {
if (e.key === 'Escape') {
closeLightbox();
if (document.getElementById('sideDrawer').classList.contains('open')) toggleMobileMenu();
}
});
// 이미지 저장: 가능하면 네이티브 공유시트(iOS/Android에서 "사진에 저장"을 한 번에 지원)를 띄우고,
// 지원 안 되는 환경(주로 데스크톱)에서는 기존 다운로드 방식으로 자동 전환됨.
async function saveOrShareImage() {
const src = currentLightboxSrc;
if (!src) return;
const fileName = src.split('/').pop();
try {
const response = await fetch(src);
const blob = await response.blob();
const file = new File([blob], fileName, { type: blob.type || 'image/jpeg' });
if (navigator.canShare && navigator.canShare({ files: [file] })) {
await navigator.share({ files: [file] });
return;
}
} catch (err) {
// 공유가 취소되었거나 실패하면 아래 다운로드 방식으로 넘어감
}
const a = document.createElement('a');
a.href = src;
a.download = fileName;
document.body.appendChild(a);
a.click();
a.remove();
}
</script>
